version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos_postgres
    restart: always
    environment:
      POSTGRES_USER: posuser
      POSTGRES_PASSWORD: pospassword
      POSTGRES_DB: posdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posuser -d posdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate
    container_name: pos_migration
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://posuser:pospassword@postgres:5432/posdb?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "posuser"
      DB_PASSWORD: "pospassword"
      DB_NAME: "posdb"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY}"
      MIDTRANS_IS_PRODUCTION: "false"
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
